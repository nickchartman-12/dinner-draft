<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Dinner Draft</title>
<meta property="og:title" content="Dinner Draft">
<meta property="og:description" content="Live restaurant draft: take turns placing chips, everyone sees every move.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bowlby+One&family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=JetBrains+Mono:wght@500&display=swap">
<style>
:root{
  --bg:#eef3f4; --surface:#ffffff; --ink:#13252e; --muted:#5d6f77; --line:#d3dfe2;
  --chip:#e2483d; --chip-ink:#ffffff; --sea:#0f7c86; --sea-soft:#d5ecee; --veto:#13252e; --gold:#d99a1e; --gold-soft:#fbefd3;
  --display:"Bowlby One","Arial Black",Impact,sans-serif;
  --body:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0d1a20; --surface:#14262e; --ink:#e7f0f2; --muted:#93a8b0; --line:#25404a;
  --chip:#f0574b; --chip-ink:#ffffff; --sea:#3fb5bf; --sea-soft:#163a42; --veto:#e7f0f2; --gold:#f0b53c; --gold-soft:#3a2f14; color-scheme:dark}}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{margin:0;color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-top:calc(16px + env(safe-area-inset-top,0px));padding-bottom:calc(60px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-family:var(--display);font-weight:400;font-size:clamp(2rem,10vw,3rem);line-height:.9;margin:0}
h1 span{color:var(--chip)}
h2{font-family:var(--display);font-weight:400;font-size:1.25rem;margin:0;text-wrap:balance}
.lede{color:var(--muted);margin:6px 0 0;font-size:.95rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
input[type=text]{flex:1;min-width:0;font:inherit;font-size:1.05rem;padding:11px 12px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
button{font:inherit;font-weight:700;cursor:pointer;border-radius:10px;border:1.5px solid var(--ink);background:var(--ink);color:var(--bg);padding:11px 16px}
button.ghost{background:transparent;color:var(--ink)}
button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--sea);outline-offset:2px}
.note{font-size:.88rem;color:var(--muted);margin:0}
.err{color:var(--chip);font-weight:600;margin:0}

/* sticky turn bar */
.turn{position:sticky;top:env(safe-area-inset-top,0px);z-index:6;border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px;background:var(--surface);border:1.5px solid var(--line);box-shadow:0 6px 18px -12px rgba(0,0,0,.4)}
.turn.mine{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
.turn .big{font-family:var(--display);font-size:1.3rem;line-height:1.1}
.turn .sub{font-family:var(--mono);font-size:.75rem;opacity:.8}
.stage{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stage b{flex:1;min-width:0}
.turn.mine button{background:var(--chip-ink);color:var(--chip);border-color:var(--chip-ink)}
.turn.mine button.ghost{background:transparent;color:var(--chip-ink)}

.seats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.seat:last-child:nth-child(odd){grid-column:1/-1}
.seat{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px;background:var(--surface);display:flex;flex-direction:column;gap:4px;min-width:0}
.seat.up{border-color:var(--chip);box-shadow:inset 4px 0 0 var(--chip)}
.seat.empty{border-style:dashed;color:var(--muted)}
.seat .who{font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.seat .left{font-family:var(--mono);font-size:.75rem;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.lp{color:var(--chip)} .lm{color:var(--sea)}

.list{display:flex;flex-direction:column;gap:6px}
.item{display:grid;grid-template-columns:1fr auto;gap:6px 10px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--surface);transition:background .4s}
.item.flash{background:var(--gold-soft)}
.item.vetoed{opacity:.5}
.item.vetoed .nm{text-decoration:line-through;text-decoration-thickness:2px}
.nm{font-weight:600;min-width:0}
a.yl{color:inherit;text-decoration:underline;text-decoration-color:var(--line);text-decoration-thickness:2px;text-underline-offset:3px}
.net{font-family:var(--mono);font-variant-numeric:tabular-nums;font-weight:700;text-align:right;min-width:3ch}
.net.pos{color:var(--chip)} .net.neg{color:var(--sea)}
.marks{grid-column:1/-1;display:flex;gap:5px;flex-wrap:wrap;align-items:center}
.mk{font-family:var(--mono);font-size:.72rem;padding:2px 7px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.mk.p{color:var(--chip)} .mk.m{color:var(--sea)}
.mk.v{background:var(--veto);color:var(--bg);border-color:var(--veto)}
.ctrl{grid-column:1/-1;display:flex;gap:6px;justify-content:flex-end}
.ctrl button{padding:6px 12px;font-size:.85rem;border-radius:8px}
.ctrl .bp{background:var(--chip);border-color:var(--chip);color:var(--chip-ink)}
.ctrl .bm{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.ctrl .bv{background:transparent;color:var(--ink);font-family:var(--mono);font-size:.75rem;letter-spacing:.06em}
.ctrl .sel{outline:3px solid var(--gold);outline-offset:2px}

.feed{display:flex;flex-direction:column;gap:4px;font-size:.9rem}
.feed div{display:flex;gap:8px}
.feed .n{font-family:var(--mono);font-size:.75rem;color:var(--muted);min-width:3ch;text-align:right;padding-top:2px}

.match{display:flex;flex-direction:column;gap:8px;padding-top:6px}
.mlabel{font-family:var(--mono);font-size:.75rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.side{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;border:1.5px solid var(--line);border-radius:12px;padding:12px}
.side .seed{font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.side .pick{padding:7px 12px;font-size:.85rem;border-radius:999px;background:transparent;color:var(--ink);border-color:var(--line)}
.side .pick.on{background:var(--sea);border-color:var(--sea);color:var(--surface)}
.side .who{grid-column:1/-1;font-family:var(--mono);font-size:.75rem;color:var(--muted)}
.side.won{border-color:var(--gold);box-shadow:inset 4px 0 0 var(--gold)}
.side.lost{opacity:.45}
.vs{font-family:var(--display);text-align:center;color:var(--muted);font-size:.9rem}
.winner{text-align:center;padding:26px 16px;border-radius:14px;background:var(--ink);color:var(--bg);display:flex;flex-direction:column;gap:6px}
.winner .eyebrow{font-family:var(--mono);font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--gold)}
.winner b{font-family:var(--display);font-weight:400;font-size:clamp(2rem,9vw,3rem);line-height:1}
details summary{cursor:pointer;color:var(--muted);font-size:.9rem}
.conn{font-family:var(--mono);font-size:.72rem;color:var(--muted)}

/* tile board */
.tightpanel{padding:12px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
@media (min-width:520px){.grid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.tile{position:relative;display:flex;flex-direction:column;gap:4px;min-width:0;min-height:96px;padding:8px 8px 22px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);transition:background .4s,transform .15s}
.tile .tt{display:flex;gap:4px;align-items:baseline;min-width:0}
.tile .tn{font-weight:700;font-size:.8rem;line-height:1.15;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow-wrap:anywhere}
.tile .rk{font-family:var(--mono);font-size:.7rem;color:var(--gold);font-weight:700}
.tile .ts{font-family:var(--display);font-size:1.5rem;line-height:1;font-variant-numeric:tabular-nums}
.tile .ts.pos{color:var(--chip)} .tile .ts.neg{color:var(--sea)}
.tile .tm{display:flex;flex-wrap:wrap;gap:3px}
.tile .mk{font-size:.62rem;padding:1px 5px}
.tile .ty{position:absolute;left:8px;bottom:5px;font-family:var(--mono);font-size:.62rem;color:var(--muted);text-decoration:none}
.tile.flash{background:var(--gold-soft)}
.tile.can{cursor:pointer;border-color:var(--ink)}
.tile.can:active{transform:scale(.97)}
.tile.cant{opacity:.45}
.tile.sel{border-color:var(--gold);box-shadow:0 0 0 3px var(--gold)}
.tile.vetoed{filter:grayscale(1);opacity:.4;background:var(--bg)}
.tile.vetoed .tn{text-decoration:line-through;text-decoration-thickness:2px}

/* bracket */
.bracket{display:grid;grid-template-columns:minmax(0,1fr) 14px minmax(0,1fr) 14px minmax(0,1fr);grid-template-rows:auto repeat(11,32px);margin-top:4px}
.bh{grid-row:1;font-family:var(--mono);font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding-bottom:6px}
.bslot{position:relative;z-index:1;margin:2px 0;border:1.5px solid var(--line);border-radius:10px;background:var(--surface);padding:5px 6px;display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto 1fr;column-gap:5px;align-content:start;min-width:0;overflow:hidden}
.bslot .bs{font-family:var(--mono);font-size:.65rem;color:var(--muted);padding-top:1px}
.bslot .bn{font-weight:700;font-size:.74rem;line-height:1.1;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.bslot .bv{grid-column:1/-1;display:flex;gap:3px;flex-wrap:wrap;align-items:center;align-self:end}
.bslot .bv i{font-style:normal;font-family:var(--mono);font-size:.6rem;padding:0 4px;border-radius:999px;background:var(--sea);color:var(--surface)}
.bslot .bv em{font-style:normal;font-family:var(--mono);font-size:.6rem;color:var(--muted)}
.bslot.can{cursor:pointer;border-color:var(--ink)}
.bslot.mine{border-color:var(--sea);box-shadow:0 0 0 2px var(--sea)}
.bslot.mine .bv em{color:var(--sea);font-weight:700}
.bslot.won{border-color:var(--gold);box-shadow:inset 3px 0 0 var(--gold)}
.bslot.lost{opacity:.4}
.bslot.tbd{border-style:dashed;color:var(--muted);background:transparent}
.bslot.champ{grid-column:5;grid-row:6/9;align-self:center;min-height:60px;display:flex;align-items:center;justify-content:center;text-align:center}
.bslot.champ.won{background:var(--ink);color:var(--bg);border-color:var(--gold);box-shadow:none}
.bslot.champ .bn{font-size:.8rem}
.r1{grid-column:1;grid-row:2/4}.r2{grid-column:1;grid-row:4/6}.r3{grid-column:1;grid-row:8/10}.r4{grid-column:1;grid-row:10/12}
.f1{grid-column:3;grid-row:3/5}.f2{grid-column:3;grid-row:9/11}
.conn{position:relative;border:2px solid var(--line);border-left:none;border-radius:0 8px 8px 0;width:50%}
.conn::after{content:"";position:absolute;left:100%;top:50%;width:calc(100% + 2px);border-top:2px solid var(--line)}
.c1{grid-column:2;grid-row:3/5;margin:16px 0}.c2{grid-column:2;grid-row:9/11;margin:16px 0}.c3{grid-column:4;grid-row:4/10;margin:16px 0}
.bstat{display:flex;gap:12px;flex-wrap:wrap;font-family:var(--mono);font-size:.72rem;color:var(--muted)}

/* rock paper scissors */
.duel{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:8px;align-items:center}
.dside{border:1.5px solid var(--line);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0;text-align:center}
.dside.me{border-color:var(--chip);box-shadow:inset 0 -4px 0 var(--chip)}
.dside b{font-size:1.05rem;overflow-wrap:anywhere}
.dside span{font-size:.8rem;color:var(--muted);overflow-wrap:anywhere}
.dside .dst{font-family:var(--mono);font-size:.72rem;color:var(--sea)}
.throws{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.throws button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:12px 4px;background:var(--surface);color:var(--ink);border-color:var(--ink);text-transform:capitalize}
.throws button span{font-size:2rem;line-height:1}

/* setup */
.step{display:flex;justify-content:space-between;align-items:center;gap:10px}
.slab{font-weight:700}
.sctl{display:flex;align-items:center;gap:10px}
.sctl b{font-family:var(--mono);min-width:2ch;text-align:center;font-size:1.1rem}
.sctl button{width:40px;height:40px;padding:0;border-radius:50%;font-size:1.2rem}
button.small,.btnlink.small{padding:6px 10px;font-size:.82rem}
.btnlink{display:inline-flex;align-items:center;font-weight:700;border-radius:10px;border:1.5px solid var(--ink);padding:11px 16px;color:var(--ink);text-decoration:none}
.plist{display:flex;flex-direction:column;gap:6px}
.prow{display:flex;gap:8px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.pmain{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}
.pmain b{overflow-wrap:anywhere}
.pmain input{font-size:.82rem;padding:6px 8px}
.flist{display:flex;flex-direction:column;gap:4px;max-height:360px;overflow-y:auto}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;text-align:left;background:var(--surface);color:var(--ink);border:1px solid var(--line);font-weight:400;padding:8px 10px}
.frow span{display:flex;flex-direction:column;min-width:0}
.frow small{color:var(--muted);font-size:.78rem}
.frow em{font-style:normal;font-family:var(--mono);font-size:.78rem;color:var(--sea);white-space:nowrap}
.frow.added{opacity:.5}
.hand{display:flex;flex-direction:column;gap:8px;margin-top:8px}
select{font:inherit;padding:10px;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.probs{display:flex;flex-direction:column;gap:4px}
.invite input{font-family:var(--mono);font-size:.8rem}

.slab small{display:block;font-weight:400;font-size:.8rem;color:var(--muted)}
.seg{display:flex;border:1.5px solid var(--ink);border-radius:10px;overflow:hidden;flex:none}
.seg button{border:none;border-radius:0;background:transparent;color:var(--ink);padding:8px 14px}
.seg button.on{background:var(--ink);color:var(--bg)}
@media (prefers-reduced-motion:reduce){.item,.tile{transition:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dinner <span>Draft</span></h1>
    <p class="lede">Veto round, then 5 laps of +1, then 2 laps of −1. Everyone sees every move.</p>
  </header>
  <div id="main"><div class="panel"><p class="note">Connecting…</p></div></div>
</div>

<script>
const DB="https://dinner-draft-55b10-default-rtdb.firebaseio.com"; // Firebase Realtime Database URL
const QS=new URLSearchParams(location.search);
let GAME=(QS.get("g")||"").replace(/[^A-Za-z0-9_-]/g,"").slice(0,40);
const ROOT=()=>`${DB.replace(/\/$/,"")}/dinnerdraft/${GAME}`;
const EV=()=>ROOT()+"/events";
// Set per game from its saved config
let SEATS=5, PLUS=5, MINUS=2, VETO=1, CAP=1, TOTAL=0, PLACES=[], LINKS=[], LOCS=[], CONFIG=null;
function applyConfig(c){
  CONFIG=c;SEATS=c.players;PLUS=c.plus;MINUS=c.minus;VETO=c.veto===0?0:1;
  PLACES=c.places.map(p=>p.name);LINKS=c.places.map(p=>p.url||"");LOCS=c.places.map(p=>p.loc||"");
  TOTAL=SEATS*(PLUS+MINUS+VETO);
  const l=$(".lede");if(l)l.textContent=`${SEATS} players · ${PLACES.length} spots. ${VETO?"Veto round, then ":"No vetoes. "}${PLUS} lap${PLUS===1?"":"s"} of +1${MINUS?`, then ${MINUS} lap${MINUS===1?"":"s"} of −1`:""}. Everyone sees every move.`;
}
const linkFor=i=>LINKS[i]||`https://www.yelp.com/search?find_desc=${encodeURIComponent(PLACES[i])}&find_loc=${encodeURIComponent(LOCS[i]||(CONFIG&&CONFIG.area)||"")}`;
const linkLabel=i=>/yelp\.com\/biz\//.test(LINKS[i])?"yelp ↗":/yelp\.com/.test(linkFor(i))?"find on yelp ↗":"link ↗";


const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const slug=s=>String(s).trim().toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"").slice(0,40);

const kindLabel={plus:"+1",minus:"−1",veto:"VETO"};

let me=null, events=[], seen=new Set(), connected=false, err="", sending=false, staged=null, lastMoveCount=-1, flashIdx=null;
const NAMEKEY=()=>"dd-name-"+GAME;
try{me=GAME?localStorage.getItem(NAMEKEY())||null:null}catch(e){}

/* ---------- deterministic game state from the shared log ---------- */
function game(){
  const G={order:[],names:{},p:{},places:PLACES.map(()=>({alloc:{},vetoBy:null})),turn:0,moves:[],picks:{},rps:{},seed:""};
  const fresh=()=>({plus:PLUS,minus:MINUS,veto:VETO});
  const remaining=k=>{const q=G.p[k];return q.plus+q.minus+q.veto};
  const advance=()=>{for(let s=1;s<=SEATS;s++){const nx=(G.turn+s)%SEATS;if(remaining(G.order[nx])>0){G.turn=nx;return}}};
  for(const e of events){
    if(e.t==="reset"){return game.fromAfter(e)}
    const k=slug(e.name||"");
    if(e.t==="join"&&k){
      if(!G.names[k]&&G.order.length<SEATS){G.order.push(k);G.names[k]=e.name;G.p[k]=fresh()}
      continue;
    }
    if(e.t==="move"&&k&&G.order.length===SEATS&&G.order[G.turn]===k){
      if(legal(G,k,e.kind,e.i)){apply(G,k,e.kind,e.i);G.moves.push({k,kind:e.kind,i:e.i});advance();if(G.moves.length===TOTAL)G.seed=String(e._id||"")}
      continue;
    }
    if(e.t==="pick"&&k&&G.names[k]&&["s1","s2","f"].includes(e.m)){(G.picks[k]=G.picks[k]||{})[e.m]=e.x}
    if(e.t==="rps"&&k&&G.names[k]&&typeof e.key==="string"&&["rock","paper","scissors"].includes(e.th)){(G.rps[e.key]=G.rps[e.key]||[]).push({k,r:e.r,th:e.th})}
  }
  G.done=G.order.length===SEATS&&G.moves.length>=TOTAL;
  return G;
}
// a reset wipes everything before it: replay only what follows the latest reset
game.fromAfter=()=>{const i=events.map(e=>e.t).lastIndexOf("reset");const keep=events;events=keep.slice(i+1);const G=game();events=keep;return G};

function phase(n){return n<SEATS*VETO?"veto":n<SEATS*(VETO+PLUS)?"plus":"minus"}
function phaseInfo(n){const ph=phase(n);if(ph==="veto")return{ph,label:"Veto round",round:""};if(ph==="plus"){const r=Math.floor((n-SEATS*VETO)/SEATS)+1;return{ph,label:"+1 rounds",round:` · round ${r} of ${PLUS}`}}const r=Math.floor((n-SEATS*(VETO+PLUS))/SEATS)+1;return{ph,label:"−1 rounds",round:` · round ${r} of ${MINUS}`}}
function legal(G,k,kind,i){
  if(kind!==phase(G.moves.length)) return false;
  const q=G.p[k], pl=G.places[i]; if(!q||!pl||pl.vetoBy) return false;
  const a=pl.alloc[k]||{p:0,m:0};
  if(kind==="plus") return q.plus>0&&a.p<CAP;
  if(kind==="minus") return q.minus>0&&a.m<CAP;
  if(kind==="veto") return q.veto>0;
  return false;
}
function apply(G,k,kind,i){
  const q=G.p[k], pl=G.places[i], a=pl.alloc[k]=pl.alloc[k]||{p:0,m:0};
  if(kind==="plus"){q.plus--;a.p++} else if(kind==="minus"){q.minus--;a.m++} else {q.veto--;pl.vetoBy=k}
}
function standings(G){
  return PLACES.map((n,i)=>{const pl=G.places[i];let net=0,backers=0;Object.values(pl.alloc).forEach(a=>{net+=a.p-a.m;if(a.p)backers++});return{i,n,net,backers,vetoed:!!pl.vetoBy}})
    .sort((a,b)=>(a.vetoed-b.vetoed)||(b.net-a.net)||(a.i-b.i));
}
const BEATS={rock:"scissors",paper:"rock",scissors:"paper"}, EMO={rock:"✊",paper:"✋",scissors:"✌️"};
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
// Same seed on every phone, so everyone sees the same randomly chosen players
function pickOne(G,arr,salt){return arr[hash(G.seed+"|"+salt)%arr.length]}
// One RPS duel between place A and place B. poolA/poolB are the players who voted for each side.
function rpsDuel(G,key,iA,iB,poolA,poolB){
  if(iA>iB){const d=rpsDuel(G,key,iB,iA,poolB,poolA);return{...d,swap:true}}
  const ka=pickOne(G,poolA.length?poolA:G.order,key+"a");
  let restB=poolB.filter(k=>k!==ka);if(!restB.length)restB=G.order.filter(k=>k!==ka);
  const kb=pickOne(G,restB,key+"b");
  let round=1,cur={},history=[],winner=null;
  for(const t of (G.rps[key]||[])){
    if(winner) break;
    if(t.r!==round||(t.k!==ka&&t.k!==kb)||cur[t.k]) continue;
    cur[t.k]=t.th;
    if(cur[ka]&&cur[kb]){
      history.push({r:round,ta:cur[ka],tb:cur[kb]});
      if(cur[ka]===cur[kb]){round++;cur={}} else winner=BEATS[cur[ka]]===cur[kb]?iA:iB;
    }
  }
  return{key,iA,iB,ka,kb,round,cur,history,winner,pending:winner===null};
}
const backersOf=(G,i)=>G.order.filter(k=>((G.places[i].alloc[k]||{}).p||0)>0);
// Final seeding: by net score; any tie that touches the top 4 is settled by RPS
function finalOrder(G){
  const base=standings(G).filter(x=>!x.vetoed), out=[], duels=[];let pending=null,j=0;
  while(j<base.length){
    const g=[base[j]];while(j+g.length<base.length&&base[j+g.length].net===base[j].net)g.push(base[j+g.length]);
    if(g.length>1&&j<4&&!pending){
      const sorted=[];
      outer: for(const x of g){
        let pos=sorted.length;
        for(let q=0;q<sorted.length;q++){
          const y=sorted[q], d=rpsDuel(G,"t"+Math.min(x.i,y.i)+"-"+Math.max(x.i,y.i),x.i,y.i,backersOf(G,x.i),backersOf(G,y.i));
          d.net=x.net;duels.push(d);
          if(d.pending){pending=d;break outer}
          if(d.winner===x.i){pos=q;break}
        }
        sorted.splice(pos,0,x);
      }
      out.push(...(pending?g:sorted));

}
function resolve(G,m,a,b){
  let va=0,vb=0;const who={a:[],b:[]},keys={a:[],b:[]};
  G.order.forEach(k=>{const p=(G.picks[k]||{})[m];if(p===a.i){va++;who.a.push(G.names[k]);keys.a.push(k)}else if(p===b.i){vb++;who.b.push(G.names[k]);keys.b.push(k)}});

  if(va+vb>=SEATS){
    if(va!==vb) winner=va>vb?a:b;

}
function results(G){
  const fo=finalOrder(G);
  const R={fo,top:null,s1:null,s2:null,fin:null,duel:fo.pending,label:""};
  if(fo.pending){const d=fo.pending;R.label=`${PLACES[d.iA]} and ${PLACES[d.iB]} tied at ${d.net>0?"+":""}${d.net}. Winner gets the higher seed.`;return R}
  if(fo.order.length<4) return R;
  const top=fo.order.slice(0,4).map((x,k)=>({...x,seed:k+1}));R.top=top;
  R.s1=resolve(G,"s1",top[0],top[3]);R.s2=resolve(G,"s2",top[1],top[2]);
  for(const [m,lab] of [["s1","Semi 1"],["s2","Semi 2"]]) if(R[m].duel&&R[m].duel.pending&&!R.duel){R.duel=R[m].duel;R.label=`${lab} tied ${R[m].va}–${R[m].vb}. Winner goes to the final.`}
  if(R.s1.winner&&R.s2.winner){R.fin=resolve(G,"f",R.s1.winner,R.s2.winner);if(R.fin.duel&&R.fin.duel.pending&&!R.duel){R.duel=R.fin.duel;R.label=`The final tied ${R.fin.va}–${R.fin.vb}. Winner is where we eat.`}}
  return R;
}
function rpsPanel(G,d,label,myKey){
  const nm=k=>esc(G.names[k]), mine=myKey===d.ka||myKey===d.kb, thrown=mine&&d.cur[myKey];
  const side=(k,i)=>`<div class="dside ${myKey===k?"me":""}"><b>${nm(k)}${myKey===k?" (you)":""}</b><span>for ${esc(PLACES[i])}</span><span class="dst">${d.cur[k]?"✓ locked in":"thinking…"}</span></div>`;
  return `<div class="panel rps"><h2>Tiebreak: rock, paper, scissors</h2><p class="note">${esc(label)} Two voters were picked at random, one from each side.</p>
    <div class="duel">${side(d.ka,d.iA)}<div class="vs">VS</div>${side(d.kb,d.iB)}</div>
    <p class="mlabel" style="margin:0">Round ${d.round}${d.history.length?" · tied so far":""}</p>
    ${mine?(thrown?`<p class="note">You threw ${EMO[d.cur[myKey]]} ${d.cur[myKey]}. Waiting for ${nm(myKey===d.ka?d.kb:d.ka)}.</p>`
      :`<div class="throws">${["rock","paper","scissors"].map(t=>`<button data-rps="${t}" data-key="${d.key}" data-r="${d.round}" ${sending?"disabled":""}><span>${EMO[t]}</span>${t}</button>`).join("")}</div><p class="note">Your throw stays hidden until both of you lock in.</p>`)
      :`<p class="note">Waiting for ${[d.ka,d.kb].filter(k=>!d.cur[k]).map(nm).join(" and ")} to throw.</p>`}
    ${d.history.length?`<div class="feed">${d.history.map(x=>`<div><span class="n">R${x.r}</span><span>${nm(d.ka)} ${EMO[x.ta]} vs ${EMO[x.tb]} ${nm(d.kb)} · tie, go again</span></div>`).join("")}</div>`:""}
  </div>`;
}
function duelLine(G,d){
  const last=d.history[d.history.length-1], wA=d.winner===d.iA;
  return `<div><span class="n">RPS</span><span><b>${esc(PLACES[d.winner])}</b> beat ${esc(PLACES[wA?d.iB:d.iA])}: ${esc(G.names[wA?d.ka:d.kb])} ${EMO[wA?last.ta:last.tb]} beat ${esc(G.names[wA?d.kb:d.ka])} ${EMO[wA?last.tb:last.ta]}${d.history.length>1?` after ${d.history.length-1} tie${d.history.length>2?"s":""}`:""}</span></div>`;
}

async function send(msg){

function board(G,myKey,myTurn,order){
  const done=G.done, ph=myTurn?phase(G.moves.length):null;
  const st=done?standings(G):null;
  const rows=done?(order?[...order.map(x=>x.i),...st.filter(x=>x.vetoed).map(x=>x.i)]:st.map(x=>x.i)):PLACES.map((_,i)=>i);
  // short tags per player: first letters, widened until unique
  const tag={};let len=1;while(len<6){G.order.forEach(k=>tag[k]=G.names[k].slice(0,len));if(new Set(Object.values(tag)).size===G.order.length)break;len++}
  return `<div class="panel tightpanel"><div class="row" style="justify-content:space-between"><h2>${done?"Final board":"The board"}</h2>${myTurn?`<span class="note">Tap a tile to ${ph==="veto"?"veto it":ph==="plus"?"add +1":"add −1"}</span>`:""}</div>
  <div class="grid">${rows.map((i,r)=>{
    const pl=G.places[i];let net=0;const marks=[];
    G.order.forEach(k=>{const a=pl.alloc[k];if(!a)return;net+=a.p-a.m;if(a.p)marks.push(`<span class="mk p">${esc(tag[k])}+${a.p}</span>`);if(a.m)marks.push(`<span class="mk m">${esc(tag[k])}−${a.m}</span>`)});
    const can=myTurn&&!pl.vetoBy&&legal(G,myKey,ph,i), sel=staged&&staged.i===i;
    const rank=done&&order&&!pl.vetoBy?`<span class="rk">#${r+1}</span>`:"";
    return `<div class="tile ${pl.vetoBy?"vetoed":""} ${flashIdx===i?"flash":""} ${myTurn?(can?"can":"cant"):""} ${sel?"sel":""}" ${can?`data-k="${ph}" data-i="${i}" role="button" tabindex="0" aria-label="${ph} ${esc(PLACES[i])}"`:""}>
      <div class="tt">${rank}<span class="tn">${esc(PLACES[i])}</span></div>
      <div class="ts ${net>0?"pos":net<0?"neg":""}">${pl.vetoBy?"✕":(net>0?"+":"")+net}</div>
      <div class="tm">${pl.vetoBy?`<span class="mk v">VETO ${esc(tag[pl.vetoBy])}</span>`:marks.join("")}</div>
      <a class="ty" href="${esc(linkFor(i))}" target="_blank" rel="noopener" aria-label="${esc(PLACES[i])} link">${linkLabel(i)}</a>
    </div>`}).join("")}</div>
  ${G.order.length?`<p class="note">${G.order.map(k=>`<b>${esc(tag[k])}</b> = ${esc(G.names[k])}`).join(" · ")}</p>`:""}</div>`;
}

let armed=false;

  const go=()=>{const v=$("#nm").value.trim();if(!slug(v))return;me=v;try{localStorage.setItem(NAMEKEY(),v)}catch(e){};announced=false;announce();render()};
  on("go",go);const n=$("#nm");if(n)n.onkeydown=e=>{if(e.key==="Enter")go()};
  document.querySelectorAll("[data-k]").forEach(b=>{const pick=()=>{staged={kind:b.dataset.k,i:+b.dataset.i};render()};b.onclick=pick;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();pick()}}});
  document.querySelectorAll(".tile a").forEach(a=>a.addEventListener("click",e=>e.stopPropagation()));
  on("cancel",()=>{staged=null;render()});
  on("play",()=>{if(staged)send({t:"move",name:me,kind:staged.kind,i:staged.i})});
  on("copylink",()=>{const b=$("#copylink"),u=b.dataset.url,inp=$("#invurl");
    const ok=()=>{b.textContent="Copied";setTimeout(()=>{if(b.isConnected)b.textContent="Copy link"},1500)};
    try{navigator.clipboard.writeText(u).then(ok,()=>{inp.select();b.textContent="Selected, now copy"})}catch(e){inp.select()}});
  document.querySelectorAll("[data-rps]").forEach(b=>b.onclick=()=>send({t:"rps",name:me,key:b.dataset.key,r:+b.dataset.r,th:b.dataset.rps}));
  document.querySelectorAll("[data-m]").forEach(b=>{const go=()=>send({t:"pick",name:me,m:b.dataset.m,x:+b.dataset.x});b.onclick=go;b.onkeydown=e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();go()}}});
  on("swap",()=>{me=null;try{localStorage.removeItem(NAMEKEY())}catch(e){};render()});
  on("reset",()=>{const r=$("#reset");if(!armed){armed=true;r.textContent="Tap again to wipe the whole game";return}armed=false;send({t:"reset"})});
}

/* ---------- live sync ---------- */
// Firebase push ids sort in creation order, so every phone replays events identically
const byId={};
function rebuild(){events=Object.keys(byId).sort().map(id=>({...byId[id],_id:id}))}
function setAll(obj){for(const k in byId)delete byId[k];if(obj&&typeof obj==="object")for(const k in obj)if(obj[k]&&typeof obj[k]==="object")byId[k]=obj[k];rebuild()}
async function poll(){
  try{const r=await fetch(EV()+".json");if(!r.ok)throw 0;setAll(await r.json());connected=true}catch(e){connected=false}
  render();
}
let es=null;
function live(){
  try{
    if(es)es.close();
    es=new EventSource(EV()+".json");
    const handle=e=>{try{const {path,data}=JSON.parse(e.data);
      if(path==="/"){setAll(data)}
      else{const id=path.replace(/^\//,"").split("/")[0];if(data===null)delete byId[id];else if(path.split("/").length===2)byId[id]=data;else{return poll()}rebuild()}
      connected=true;render()}catch(err){}};
    es.addEventListener("put",handle);es.addEventListener("patch",e=>{poll()});
    es.onopen=()=>{connected=true;render()};
    es.onerror=()=>{connected=false;render()};
  }catch(e){}
}
let announced=false;
function announce(){
  if(!me||announced)return;announced=true;
  const G=game();if(G.names[slug(me)]||G.order.length>=SEATS)return;
  fetch(EV()+".json",{method:"POST",body:JSON.stringify({t:"join",name:me})}).catch(()=>{announced=false});
}
function inviteBar(){
  const url=location.origin+location.pathname+"?g="+GAME;
  return `<div class="panel invite"><div class="row" style="justify-content:space-between"><b>Invite your group</b><button class="ghost small" id="copylink" data-url="${esc(url)}">Copy link</button></div><input type="text" id="invurl" readonly value="${esc(url)}" aria-label="Game link"></div>`;
}

/* ---------- setup: build a new game ---------- */
let SU={players:5,plus:5,minus:2,veto:1,zip:"",radius:5,area:"",center:null,places:[],found:[],foundLabel:"",q:"",mname:"",murl:"",busy:"",err:"",creating:false};
try{const d=JSON.parse(localStorage.getItem("dd-setup")||"null");if(d&&Array.isArray(d.places))SU={...SU,...d,found:[],busy:"",err:"",creating:false}}catch(e){}
const saveSU=()=>{try{const {found,busy,err,creating,...keep}=SU;localStorage.setItem("dd-setup",JSON.stringify(keep))}catch(e){}};
const has=n=>SU.places.some(p=>p.name.trim().toLowerCase()===n.trim().toLowerCase());
function addPlace(p){if(!p.name.trim()||has(p.name))return false;SU.places.push({name:p.name.trim().slice(0,60),url:p.url||"",loc:p.loc||""});saveSU();return true}
function problems(){
  const n=SU.places.length,out=[];
  const need=SU.veto?SU.players+4:4;
  if(n<need) out.push(`Add at least ${need} restaurants${SU.veto?" (one veto per person still leaves 4 for the bracket)":" (the bracket needs 4)"}. You have ${n}.`);
  else{
    const left=n-(SU.veto?SU.players:0);
    if(SU.plus>left) out.push(`With ${n} restaurants, at most ${left} can survive the vetoes, so +1 chips can't be more than ${left}.`);
    if(SU.minus>left) out.push(`−1 chips can't be more than ${left}.`);
  }
  SU.places.forEach(p=>{if(p.url&&!/^https?:\/\//i.test(p.url))out.push(`The link for ${p.name} must start with https://`)});
  return out;
}
function miles(a,b){const R=3958.8,r=x=>x*Math.PI/180,dl=r(b.lat-a.lat),dn=r(b.lon-a.lon);const h=Math.sin(dl/2)**2+Math.cos(r(a.lat))*Math.cos(r(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
async function geoZip(zip){
  const r=await fetch(`https://nominatim.openstreetmap.org/search?postalcode=${encodeURIComponent(zip)}&country=us&format=json&limit=1&addressdetails=1`);
  const j=await r.json();if(!j.length)throw new Error("zip");
  const a=j[0].address||{};return{lat:+j[0].lat,lon:+j[0].lon,label:[a.city||a.town||a.village||a.suburb||"",a.state||""].filter(Boolean).join(", ")||zip};
}
async function overpass(center,radiusMi,nameQ){
  const esc2=t=>t.replace(/[\\"]/g,"").replace(/[.*+?^${}()|[\]]/g,"\\\\$&");
  const f=nameQ?`["name"~"${esc2(nameQ)}",i]`:`["name"]`, kinds=nameQ?"^(restaurant|fast_food|cafe|bar|pub)$":"^restaurant$";
  const q=`[out:json][timeout:25];nwr["amenity"~"${kinds}"]${f}(around:${Math.round(radiusMi*1609)},${center.lat},${center.lon});out center tags 400;`;
  const r=await fetch("https://overpass-api.de/api/interpreter",{method:"POST",body:"data="+encodeURIComponent(q)});
  if(!r.ok)throw new Error("overpass "+r.status);
  const seen=new Map();
  for(const el of (await r.json()).elements||[]){
    const t=el.tags||{},lat=el.lat??(el.center&&el.center.lat),lon=el.lon??(el.center&&el.center.lon);if(!t.name||lat==null)continue;
    const d=miles(center,{lat,lon}),k=t.name.toLowerCase();
    if(seen.has(k)&&seen.get(k).d<=d)continue;
    seen.set(k,{name:t.name,cuisine:(t.cuisine||"").split(";")[0].replace(/_/g," "),d,loc:t["addr:city"]||SU.area||SU.zip});
  }
  return [...seen.values()].sort((a,b)=>a.d-b.d);
}
async function findNearby(){
  const zip=SU.zip.trim();if(!/^\d{5}$/.test(zip)){SU.err="Enter a 5-digit zip code.";renderSetup();return}
  SU.busy="near";SU.err="";renderSetup();
  try{
    if(!SU.center||SU.center.zip!==zip){const c=await geoZip(zip);SU.center={...c,zip};SU.area=c.label}
    const res=await overpass(SU.center,SU.radius);
    SU.found=res;SU.foundLabel=`${res.length} restaurants within ${SU.radius} mi of ${SU.area}`;
    if(!res.length)SU.err="Nothing found there. Try a bigger radius.";
  }catch(e){SU.err=e.message==="zip"?"Couldn't find that zip code.":"The map service didn't answer. Wait a few seconds and try again, or add places by hand."}
  SU.busy="";saveSU();renderSetup();
}
async function searchName(){
  const q=SU.q.trim();if(q.length<2)return;
  SU.busy="search";SU.err="";renderSetup();
  try{
    if(SU.zip&&/^\d{5}$/.test(SU.zip)&&(!SU.center||SU.center.zip!==SU.zip)){const c=await geoZip(SU.zip);SU.center={...c,zip:SU.zip};SU.area=c.label}
    if(!SU.center){SU.err="Enter your zip code first so the search knows where to look.";SU.busy="";renderSetup();return}
    const res=await overpass(SU.center,25,q);
    SU.found=res;SU.foundLabel=`${res.length} match${res.length===1?"":"es"} for “${q}” near ${SU.area}`;
    if(!res.length)SU.err=`No match for “${q}”. Check the spelling or add it by hand below.`;
  }catch(e){SU.err="The map service didn't answer. Wait a few seconds and try again, or add it by hand."}
  SU.busy="";renderSetup();
}
async function createGame(){
  if(problems().length||SU.creating)return;
  SU.creating=true;renderSetup();
  const id=Math.random().toString(36).slice(2,8)+Date.now().toString(36).slice(-3);
  const cfg={players:SU.players,plus:SU.plus,minus:SU.minus,veto:SU.veto?1:0,area:SU.area||"",places:SU.places.map(p=>({name:p.name,url:p.url||"",loc:p.loc||""})),created:Date.now()};
  try{
    const r=await fetch(`${DB.replace(/\/$/,"")}/dinnerdraft/${id}/config.json`,{method:"PUT",body:JSON.stringify(cfg)});if(!r.ok)throw 0;
    history.replaceState(null,"",location.pathname+"?g="+id);GAME=id;boot();
  }catch(e){SU.creating=false;SU.err="Couldn't create the game. Check your connection and try again.";renderSetup()}
}
function stepper(id,label,val,min,max,note){
  return `<div class="step"><span class="slab">${label}${note?`<small>${note}</small>`:""}</span><div class="sctl"><button class="ghost" data-step="${id}" data-d="-1" ${val<=min?"disabled":""} aria-label="Fewer ${label}">−</button><b>${val}</b><button class="ghost" data-step="${id}" data-d="1" ${val>=max?"disabled":""} aria-label="More ${label}">+</button></div></div>`;
}
function renderSetup(){
  const P=problems(), moves=SU.players*(SU.veto+SU.plus+SU.minus);
  const found=SU.found.slice(0,40);
  $("#main").innerHTML=`
  <div class="panel"><h2>New game</h2>
    ${stepper("players","Players",SU.players,2,12)}
    ${stepper("plus","+1 chips each",SU.plus,1,10)}
    ${stepper("minus","−1 chips each",SU.minus,0,6)}
    <div class="step"><span class="slab">Vetoes<small>Each person can kill one place before voting starts</small></span><div class="seg" role="group" aria-label="Vetoes"><button class="${SU.veto?"on":""}" data-veto-opt="1" aria-pressed="${!!SU.veto}">On</button><button class="${SU.veto?"":"on"}" data-veto-opt="0" aria-pressed="${!SU.veto}">Off</button></div></div>
    <p class="note">${SU.veto?"1 veto, then ":""}${SU.plus} +1${SU.plus===1?"":"s"}${SU.minus?` and ${SU.minus} −1${SU.minus===1?"":"s"}`:""} each. ${moves} moves total, about ${Math.round(moves*0.4)}–${moves} minutes depending on your group.</p>
  </div>
  <div class="panel"><div class="row" style="justify-content:space-between"><h2>Restaurants · ${SU.places.length}</h2>${SU.places.length?`<button class="ghost small" id="clearall">Clear all</button>`:""}</div>
    ${SU.places.length?`<div class="plist">${SU.places.map((p,i)=>`<div class="prow"><div class="pmain"><b>${esc(p.name)}</b><input type="text" data-url="${i}" value="${esc(p.url)}" placeholder="Yelp link (optional)" aria-label="Link for ${esc(p.name)}"></div><button class="ghost small" data-del="${i}" aria-label="Remove ${esc(p.name)}">✕</button></div>`).join("")}</div>
      <p class="note">No link? The tile links to a Yelp search for the name instead.</p>`
      :`<p class="note">Nothing yet. Find places near a zip code, search by name, or add them by hand.</p>`}
  </div>
  <div class="panel"><h2>Add restaurants</h2>
    <div class="row"><input type="text" id="zip" inputmode="numeric" maxlength="5" placeholder="Zip code" value="${esc(SU.zip)}" style="flex:0 0 7.5em">
      <select id="radius" aria-label="Distance">${[2,5,10,15].map(m=>`<option value="${m}" ${SU.radius===m?"selected":""}>${m} mi</option>`).join("")}</select>
      <button id="near" ${SU.busy?"disabled":""}>${SU.busy==="near"?"Looking…":"Find nearby"}</button></div>
    <div class="row"><input type="text" id="q" placeholder="Search by name" value="${esc(SU.q)}"><button class="ghost" id="search" ${SU.busy?"disabled":""}>${SU.busy==="search"?"Searching…":"Search"}</button></div>
    ${SU.err?`<p class="err">${esc(SU.err)}</p>`:""}
    ${found.length?`<div class="row" style="justify-content:space-between"><span class="note">${esc(SU.foundLabel)}</span><button class="ghost small" id="addtop">Add top 10</button></div>
      <div class="flist">${found.map((f,i)=>{const added=has(f.name);return `<button class="frow ${added?"added":""}" data-add="${i}" ${added?"disabled":""}><span><b>${esc(f.name)}</b><small>${esc([f.cuisine,f.d.toFixed(1)+" mi"].filter(Boolean).join(" · "))}</small></span><em>${added?"added":"+ add"}</em></button>`}).join("")}</div>`:""}
    <details ${SU.mname?"open":""}><summary>Add by hand</summary><div class="hand">
      <input type="text" id="mname" placeholder="Restaurant name" value="${esc(SU.mname)}">
      <input type="text" id="murl" placeholder="Yelp link (optional)" value="${esc(SU.murl)}">
      <button class="ghost" id="madd">Add</button></div></details>
    <p class="note">Nearby results come from OpenStreetMap, so a few new spots may be missing. Search or add those by hand.</p>
  </div>
  <div class="panel">
    ${P.length?`<div class="probs">${P.map(x=>`<p class="err">${esc(x)}</p>`).join("")}</div>`:`<p class="note">Ready. You'll get a link to send your group.</p>`}
    <button id="create" ${P.length||SU.creating?"disabled":""}>${SU.creating?"Creating…":"Create game"}</button>
  </div>`;
  const on=(id,f)=>{const e=$("#"+id);if(e)e.onclick=f};
  document.querySelectorAll("[data-step]").forEach(b=>b.onclick=()=>{const k=b.dataset.step;SU[k]+= +b.dataset.d;saveSU();renderSetup()});
  document.querySelectorAll("[data-veto-opt]").forEach(b=>b.onclick=()=>{SU.veto=+b.dataset.vetoOpt;saveSU();renderSetup()});
  document.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>{SU.places.splice(+b.dataset.del,1);saveSU();renderSetup()});
  document.querySelectorAll("[data-url]").forEach(inp=>{inp.oninput=()=>{SU.places[+inp.dataset.url].url=inp.value.trim();saveSU()};inp.onchange=()=>renderSetup()});
  document.querySelectorAll("[data-add]").forEach(b=>b.onclick=()=>{const f=SU.found[+b.dataset.add];addPlace({name:f.name,loc:f.loc});renderSetup()});
  const bindIn=(id,key,enter)=>{const e=$("#"+id);if(!e)return;e.oninput=()=>{SU[key]=e.value;saveSU()};if(enter)e.onkeydown=ev=>{if(ev.key==="Enter")enter()}};
  bindIn("zip","zip",findNearby);bindIn("q","q",searchName);bindIn("mname","mname");bindIn("murl","murl");
  const rs=$("#radius");if(rs)rs.onchange=()=>{SU.radius=+rs.value;saveSU()};
  on("near",findNearby);on("search",searchName);
  on("addtop",()=>{SU.found.slice(0,10).forEach(f=>addPlace({name:f.name,loc:f.loc}));renderSetup()});
  on("madd",()=>{if(addPlace({name:SU.mname,url:SU.murl.trim(),loc:SU.area||SU.zip})){SU.mname="";SU.murl=""}else if(SU.mname.trim())SU.err="That one's already on the list.";saveSU();renderSetup()});
  on("clearall",()=>{const b=$("#clearall");if(b.dataset.armed){SU.places=[];saveSU();renderSetup()}else{b.dataset.armed=1;b.textContent="Tap again to clear"}});
  on("create",createGame);
}

/* ---------- boot ---------- */
let started=false;
async function boot(){
  if(!GAME){$(".lede").textContent="Set up a game: pick how many people, pick the restaurants, send the link.";renderSetup();return}
  $("#main").innerHTML=`<div class="panel"><p class="note">Loading game…</p></div>`;
  try{
    const r=await fetch(ROOT()+"/config.json");const c=await r.json();
    if(!c||!Array.isArray(c.places)){$("#main").innerHTML=`<div class="panel"><h2>Game not found</h2><p class="note">This link doesn't match a game. Check it, or start a new one.</p><a class="btnlink" href="${location.pathname}">New game</a></div>`;return}
    applyConfig(c);
  }catch(e){$("#main").innerHTML=`<div class="panel"><h2>Can't reach the game</h2><p class="note">Check your connection, then reload.</p></div>`;return}
  try{me=localStorage.getItem(NAMEKEY())||null}catch(e){}
  render();await poll();announce();
  if(!started){started=true;live();setInterval(poll,15000);document.addEventListener("visibilitychange",()=>{if(!document.hidden)poll()})}
}
boot();
</script>
</body>
